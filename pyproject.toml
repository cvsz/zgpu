[project]
name = "zgpu"
version = "1.0.0"
description = "Full-stack synthesizable SIMT GPU architecture with cycle-accurate simulator, JIT compiler, and LLM engine"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [
    {name = "cvsz"},
]
keywords = [
    "gpu", "simt", "simulator", "compiler", "llm",
    "tensor-cores", "rtl", "systemverilog", "isa",
    "neural-network", "rasterizer", "cycle-accurate",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Compilers",
    "Topic :: Software Development :: Assemblers",
    "Topic :: System :: Hardware",
]

[project.urls]
Homepage = "https://github.com/cvsz/zgpu"
Documentation = "https://github.com/cvsz/zgpu/tree/main/docs"
Repository = "https://github.com/cvsz/zgpu"
Issues = "https://github.com/cvsz/zgpu/issues"
Changelog = "https://github.com/cvsz/zgpu/blob/main/CHANGELOG.md"

[project.scripts]
zcc = "compiler.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
]
torch = [
    "torch>=2.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = [
    "isa*",
    "simulator*",
    "kernels*",
    "nn*",
    "llm*",
    "rasterizer*",
    "compiler*",
    "runtime*",
    "distributed*",
    "cluster*",
    "dashboard*",
    "agi*",
    "self_coding*",
    "torch_compat*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B006",  # mutable default argument (used in dataclasses)
    "SIM108", # ternary operator (readability preference)
]

[tool.ruff.lint.isort]
known-first-party = [
    "isa", "simulator", "kernels", "nn", "llm",
    "rasterizer", "compiler", "runtime", "distributed",
    "cluster", "dashboard", "agi", "self_coding", "torch_compat",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
